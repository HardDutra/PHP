<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
/* Fundo em gradiente P&B para dar contraste ao desfoque */
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #000000 0%, #434343 50%, #e0e0e0 100%);
  font-family: system-ui, -apple-system, sans-serif;
}

/* Cartão com tom escuro transparente (Dark Glass) */
.glass-card {
  width: 300px;
  padding: 30px;
  border-radius: 16px;
  
  /* Fundo preto com 40% de opacidade */
  background: rgba(0, 0, 0, 0.4);
  
  /* Desfoque do elemento atrás */
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  
  /* Borda branca translúcida para simular o reflexo no vidro */
  border: 1px solid rgba(255, 255, 255, 0.2);
  
  /* Sombra suave e profunda */
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
  
  color: #ffffff;
}

/* Botão em contraste P&B */
.glass-button {
  margin-top: 15px;
  padding: 10px 20px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  color: #ffffff;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: all 0.3s ease;
}

.glass-button:hover {
  background: rgba(255, 255, 255, 0.9);
  color: #000000; /* Inverte a cor do texto ao passar o mouse */
}
</style>
<body>
    <div class="glass-container">
  <div class="glass-card">
    <h2>Glassmorphism</h2>
    <p>Um efeito moderno de vidro fosco usando CSS puro.</p>
    <button class="glass-button">Saber mais</button>
  </div>
</div>
</body>
</html>
